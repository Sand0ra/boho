version: "3"
services:
  django:
    build: .
    container_name: boho-back
    ports:
      - "8008:8008"
    volumes:
      - .:/app
      - static_volume:/usr/src/app/back_static
      - media_volume:/usr/src/app/back_media
    restart: always
    command: sh -c "gunicorn config.wsgi:application --bind 0.0.0.0:8008"
    depends_on:
      - db

  nginx:
    image: nginx
    container_name: nginx_kutman
    ports:
      - "88:88"
    volumes:
      - ./nginx/nginx-loc.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/usr/src/app/back_static
      - media_volume:/usr/src/app/back_media
    depends_on:
      - django

  db:
    image: postgres
    container_name: postgres_kutman
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  static_volume:
  media_volume:
  postgres_data:
